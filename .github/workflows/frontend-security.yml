name: Validar frontend público

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Validar todo JavaScript público
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Impedir backend e infraestrutura no repositório público
        shell: bash
        run: |
          set -euo pipefail
          test ! -e worker.js
          test ! -e wrangler.toml
          test ! -e wrangler.json
          test ! -e wrangler.jsonc
          test ! -e G-HOST-WORKER-TOTP-PLANOS.js
          test ! -d publisher-worker
          if find . -type f \( -name '*.sql' -o -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) -print -quit | grep -q .; then
            echo 'Arquivo interno/sensível encontrado no repositório público.' >&2
            exit 1
          fi

      - name: Bloquear APIs inseguras no JavaScript público
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE --include='*.js' --exclude-dir=.git \
            '(^|[^A-Za-z0-9_])(eval[[:space:]]*\(|new[[:space:]]+Function[[:space:]]*\(|document\.write[[:space:]]*\(|insertAdjacentHTML[[:space:]]*\(|Math\.random[[:space:]]*\()|\.innerHTML[[:space:]]*=|\.outerHTML[[:space:]]*=' .; then
            echo 'API de execução/HTML dinâmico ou aleatoriedade insegura detectada.' >&2
            exit 1
          fi

      - name: Impedir publicação operacional via GitHub
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE --exclude-dir=.git --exclude='.github/workflows/frontend-security.yml' \
            '(api\.github\.com|raw\.githubusercontent\.com|GITHUB_[T]OKEN|GITHUB_[O]WNER|GITHUB_[R]EPO|GITHUB_[B]RANCH)' .; then
            echo 'Referência de publicação/backend via GitHub detectada no frontend público.' >&2
            exit 1
          fi

      - name: Procurar padrões comuns de segredo
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE --exclude-dir=.git --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.webp' \
            '(github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|re_[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .; then
            echo 'Possível segredo detectado.' >&2
            exit 1
          fi

      - name: Validar CSP das páginas de credenciais
        shell: bash
        run: |
          set -euo pipefail
          for file in entrar.html cadastro.html recuperar-senha.html; do
            grep -Fq "default-src 'none'" "$file"
            grep -Fq "base-uri 'none'" "$file"
            grep -Fq "https://challenges.cloudflare.com" "$file"
            grep -Fq "https://api.g-host.seg.br" "$file"
          done

      - name: Validar headers preparados para Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          test -f _headers
          grep -Fq 'X-Content-Type-Options: nosniff' _headers
          grep -Fq 'X-Frame-Options: DENY' _headers
          grep -Fq 'Strict-Transport-Security:' _headers
          grep -Fq 'Cache-Control: no-store' _headers

      - name: Registrar hashes dos documentos públicos
        shell: bash
        run: |
          set -euo pipefail
          sha256sum termos.html privacidade.html
