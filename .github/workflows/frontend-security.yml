name: Validar frontend público

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validar JavaScript público
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Manter repositório público mínimo
        shell: bash
        run: |
          set -euo pipefail
          for dir in backend internal private infra docs marketing; do
            test ! -e "$dir"
          done
          if find . -type f \( -name '*.sql' -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '*.toml' -o -name '*.jsonc' -o -name '*.md' \) -not -path './.git/*' -print -quit | grep -q .; then
            echo 'Arquivo não necessário ao frontend público encontrado.' >&2
            exit 1
          fi

      - name: Bloquear APIs inseguras no JavaScript
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE --include='*.js' --exclude-dir=.git \
            '(^|[^A-Za-z0-9_])(eval[[:space:]]*\(|new[[:space:]]+Function[[:space:]]*\(|document\.write[[:space:]]*\(|insertAdjacentHTML[[:space:]]*\(|Math\.random[[:space:]]*\()|\.innerHTML[[:space:]]*=|\.outerHTML[[:space:]]*=' .; then
            echo 'API insegura detectada no JavaScript público.' >&2
            exit 1
          fi

      - name: Exigir allowlist de origem da API
        shell: bash
        run: |
          set -euo pipefail
          for file in auth-config.js client-config.js; do
            grep -Fq 'APPROVED_API_ORIGINS' "$file"
            grep -Fq 'apiOriginApproved' "$file"
            grep -Fq 'https://g-host-secure.naubertymoraes13.workers.dev' "$file"
            grep -Fq 'https://api.g-host.seg.br' "$file"
          done

      - name: Impedir dependência operacional do GitHub no frontend
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE --exclude-dir=.git --exclude-dir=.github \
            '(api\.github\.com|raw\.githubusercontent\.com|github_pat_|ghp_)' .; then
            echo 'Dependência operacional ou credencial GitHub detectada.' >&2
            exit 1
          fi

      - name: Procurar padrões comuns de segredo
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE --exclude-dir=.git --exclude-dir=.github --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.webp' \
            '(github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|re_[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .; then
            echo 'Possível segredo detectado.' >&2
            exit 1
          fi

      - name: Validar CSP das páginas de credenciais
        shell: bash
        run: |
          set -euo pipefail
          for file in entrar.html cadastro.html recuperar-senha.html; do
            grep -Fq "default-src 'none'" "$file"
            grep -Fq "base-uri 'none'" "$file"
            grep -Fq "https://challenges.cloudflare.com" "$file"
            grep -Fq "https://api.g-host.seg.br" "$file"
          done

      - name: Registrar hashes dos documentos legais
        shell: bash
        run: |
          set -euo pipefail
          sha256sum termos.html privacidade.html
