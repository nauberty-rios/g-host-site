name: Validar frontend público

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar JavaScript público
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in *.js; do
            node --check "$file"
          done

      - name: Impedir backend e infraestrutura no repositório público
        shell: bash
        run: |
          set -euo pipefail
          test ! -e worker.js
          test ! -e wrangler.toml
          test ! -e G-HOST-WORKER-TOTP-PLANOS.js
          test ! -d publisher-worker
          if find . -type f \( -name '*.sql' -o -name '.env' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'Arquivo interno/sensível encontrado no repositório público.' >&2
            exit 1
          fi

      - name: Procurar padrões comuns de segredo
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE --exclude-dir=.git --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.webp' \
            '(github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|re_[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .; then
            echo 'Possível segredo detectado.' >&2
            exit 1
          fi
